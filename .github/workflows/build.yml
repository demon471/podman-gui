name: Build & Release

on:
  push:
    tags:
      - 'v*'
  # 允许手动触发，便于在不打 tag 的情况下验证 workflow
  workflow_dispatch:

# 同一 tag 重复推送时，取消旧任务
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # CI 无显示器，Qt 需离屏模式
  QT_QPA_PLATFORM: offscreen
  # 避免 pip 输出刷屏
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  build:
    name: 打包 Linux x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: 安装系统依赖
        run: |
          sudo apt-get update -qq
          # PyQt6 运行期依赖（GL、xcb、字体）
          sudo apt-get install -y -qq --no-install-recommends \
            libgl1 libegl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 \
            libdbus-1-3 libfontconfig1 \
            fonts-noto-cjk

      - name: 安装 Python 依赖
        run: pip install -r requirements-ci.txt

      - name: 验证依赖可导入
        run: |
          python - <<'PY'
          import sys
          import PyQt6.QtCore, PyQt6.QtGui, PyQt6.QtWidgets, PyQt6.QtSvg
          import yaml, pyte, pexpect, PyInstaller

          def ver(mod, attr="__version__"):
              # pyte 没有 __version__，用 importlib.metadata 兜底
              v = getattr(mod, attr, None)
              if v:
                  return v
              try:
                  from importlib.metadata import version
                  return version(mod.__name__)
              except Exception:
                  return "(未知)"

          print(f"Python     : {sys.version.split()[0]}")
          print(f"Qt         : {PyQt6.QtCore.QT_VERSION_STR}")
          print(f"PyQt6      : {PyQt6.QtCore.PYQT_VERSION_STR}")
          print(f"PyYAML     : {ver(yaml)}")
          print(f"pyte       : {ver(pyte)}")
          print(f"pexpect    : {ver(pexpect)}")
          print(f"PyInstaller: {ver(PyInstaller)}")
          PY

      - name: 语法检查
        run: python -m py_compile main.py core/*.py ui/*.py resources/*.py

      - name: 打包
        run: pyinstaller --clean --noconfirm podman-gui.spec

      - name: 验证产物内容
        run: |
          ls -lh dist/podman-gui
          file dist/podman-gui
          python - <<'PY'
          import subprocess, sys

          BIN = "dist/podman-gui"

          # 顶层条目（二进制库、数据文件）
          top = subprocess.run(
              ["pyi-archive_viewer", "-l", BIN],
              capture_output=True, text=True,
          ).stdout

          # 纯 Python 模块在 PYZ 压缩包里，需递归展开
          pyz = subprocess.run(
              ["pyi-archive_viewer", "-r", BIN],
              input="O PYZ.pyz\nX PYZ.pyz\nQ\n",
              capture_output=True, text=True,
          ).stdout

          checks = [
              ("应用图标 256px", "resources/appicon/podman-gui-256.png", top),
              ("桌面文件",       "resources/podman-gui.desktop",        top),
              ("Qt6 二进制库",   "PyQt6/Qt6/lib/libQt6Core",            top),
              ("PyYAML",         "'yaml'",                              pyz),
              ("pyte 终端",      "'pyte'",                              pyz),
              ("pexpect",        "'pexpect'",                           pyz),
              ("wcwidth",        "wcwidth",                             top),
          ]

          failed = []
          for label, needle, hay in checks:
              ok = needle in hay
              print(f"{'✓' if ok else '✗'} {label}")
              if not ok:
                  failed.append(label)

          if failed:
              print(f"\n::error::产物缺少: {', '.join(failed)}")
              sys.exit(1)

          size = __import__("os").path.getsize(BIN) / 1024**2
          print(f"\n产物大小: {size:.1f} MB")
          PY

      - name: 冒烟测试
        run: |
          set +e
          timeout 8 ./dist/podman-gui > /tmp/smoke.log 2>&1
          RC=$?
          echo "退出码: $RC（124 = 超时正常，0 = 正常退出）"
          echo "--- 输出 ---"
          cat /tmp/smoke.log
          if [ $RC -ne 0 ] && [ $RC -ne 124 ]; then
            echo "::error::冒烟测试失败，退出码 $RC"
            exit 1
          fi

      - name: 准备发布文件
        id: pkg
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          NAME="podman-gui-v${VERSION}-linux-x86_64"

          mkdir -p release
          cp dist/podman-gui "release/${NAME}"
          chmod +x "release/${NAME}"

          # 桌面集成附件（desktop 文件 + 全尺寸图标）
          tar -czf "release/${NAME}-desktop.tar.gz" \
            -C resources podman-gui.desktop appicon

          # 校验和
          ( cd release && sha256sum "${NAME}" > "${NAME}.sha256" )

          {
            echo "name=${NAME}"
            echo "version=${VERSION}"
          } >> "$GITHUB_OUTPUT"

          ls -lh release/

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: podman-gui-${{ steps.pkg.outputs.version }}
          path: release/*
          retention-days: 14
          if-no-files-found: error

      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.pkg.outputs.version }}
          generate_release_notes: true
          files: |
            release/${{ steps.pkg.outputs.name }}
            release/${{ steps.pkg.outputs.name }}.sha256
            release/${{ steps.pkg.outputs.name }}-desktop.tar.gz
          body: |
            ## 直接运行

            ```bash
            chmod +x ${{ steps.pkg.outputs.name }}
            ./${{ steps.pkg.outputs.name }}
            ```

            ## 前置条件

            Podman socket 必须运行：

            ```bash
            systemctl --user enable --now podman.socket
            ```

            验证：

            ```bash
            curl --unix-socket /run/user/$(id -u)/podman/podman.sock \
                 --noproxy '*' http://d/v5.0.0/libpod/_ping
            # 应返回 OK
            ```

            ## 系统依赖

            单文件已内置 Python 与 PyQt6，但需系统提供 Qt6 基础库：

            | 发行版 | 命令 |
            |---|---|
            | Arch / CachyOS | `sudo pacman -S qt6-base qt6-svg` |
            | Ubuntu / Debian | `sudo apt install libqt6svg6` |
            | Fedora | `sudo dnf install qt6-qtsvg` |

            ## 桌面集成（可选）

            ```bash
            tar -xzf ${{ steps.pkg.outputs.name }}-desktop.tar.gz

            mkdir -p ~/.local/bin ~/.local/share/applications
            ln -sf "$PWD/${{ steps.pkg.outputs.name }}" ~/.local/bin/podman-gui
            cp podman-gui.desktop ~/.local/share/applications/

            # 图标必须装到当前 KDE 图标主题目录
            THEME=$(kreadconfig6 --file kdeglobals --group Icons --key Theme)
            for dir in hicolor "$THEME" "${THEME}-dark"; do
                for size in 16 22 24 32 48 64 128 256 512; do
                    if [ "$dir" = "hicolor" ]; then
                        dest="$HOME/.local/share/icons/hicolor/${size}x${size}/apps"
                    else
                        dest="$HOME/.local/share/icons/$dir/apps/$size"
                    fi
                    mkdir -p "$dest"
                    cp "appicon/podman-gui-${size}.png" "$dest/podman-gui.png"
                done
            done

            gtk-update-icon-cache -f -t ~/.local/share/icons/hicolor
            kbuildsycoca6 --noincremental
            ```

            ## 校验

            ```bash
            sha256sum -c ${{ steps.pkg.outputs.name }}.sha256
            ```
