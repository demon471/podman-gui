name: Build & Release

on:
  push:
    tags:
      - 'v*'
  # 允许手动触发，便于在不打 tag 的情况下验证 workflow
  workflow_dispatch:

# 同一 tag 重复推送时，取消旧任务
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # CI 无显示器，Qt 需离屏模式
  QT_QPA_PLATFORM: offscreen
  # 避免 pip 输出刷屏
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  build:
    name: 打包 Linux x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: 安装系统依赖
        run: |
          sudo apt-get update -qq
          # PyQt6 运行期依赖（GL、xcb、字体）
          sudo apt-get install -y -qq --no-install-recommends \
            libgl1 libegl1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 \
            libdbus-1-3 libfontconfig1 \
            fonts-noto-cjk

      - name: 安装 Python 依赖
        run: pip install -r requirements-ci.txt

      - name: 验证依赖可导入
        run: |
          python - <<'PY'
          import sys
          import PyQt6.QtCore, PyQt6.QtGui, PyQt6.QtWidgets, PyQt6.QtSvg
          import yaml, pyte, pexpect, PyInstaller

          def ver(mod, attr="__version__"):
              # pyte 没有 __version__，用 importlib.metadata 兜底
              v = getattr(mod, attr, None)
              if v:
                  return v
              try:
                  from importlib.metadata import version
                  return version(mod.__name__)
              except Exception:
                  return "(未知)"

          print(f"Python     : {sys.version.split()[0]}")
          print(f"Qt         : {PyQt6.QtCore.QT_VERSION_STR}")
          print(f"PyQt6      : {PyQt6.QtCore.PYQT_VERSION_STR}")
          print(f"PyYAML     : {ver(yaml)}")
          print(f"pyte       : {ver(pyte)}")
          print(f"pexpect    : {ver(pexpect)}")
          print(f"PyInstaller: {ver(PyInstaller)}")
          PY

      - name: 语法检查
        run: python -m py_compile main.py core/*.py ui/*.py resources/*.py

      - name: 打包
        run: pyinstaller --clean --noconfirm podman-gui.spec

      - name: 验证产物内容
        run: |
          ls -lh dist/podman-gui
          file dist/podman-gui
          python - <<'PY'
          import subprocess, sys

          BIN = "dist/podman-gui"

          # 顶层条目（二进制库、数据文件）
          top = subprocess.run(
              ["pyi-archive_viewer", "-l", BIN],
              capture_output=True, text=True,
          ).stdout

          # 纯 Python 模块在 PYZ 压缩包里，需递归展开
          pyz = subprocess.run(
              ["pyi-archive_viewer", "-r", BIN],
              input="O PYZ.pyz\nX PYZ.pyz\nQ\n",
              capture_output=True, text=True,
          ).stdout

          checks = [
              ("应用图标 256px", "resources/appicon/podman-gui-256.png", top),
              ("桌面文件",       "resources/podman-gui.desktop",        top),
              ("Qt6 二进制库",   "PyQt6/Qt6/lib/libQt6Core",            top),
              ("PyYAML",         "'yaml'",                              pyz),
              ("pyte 终端",      "'pyte'",                              pyz),
              ("pexpect",        "'pexpect'",                           pyz),
              ("wcwidth",        "wcwidth",                             top),
          ]

          failed = []
          for label, needle, hay in checks:
              ok = needle in hay
              print(f"{'✓' if ok else '✗'} {label}")
              if not ok:
                  failed.append(label)

          if failed:
              print(f"\n::error::产物缺少: {', '.join(failed)}")
              sys.exit(1)

          size = __import__("os").path.getsize(BIN) / 1024**2
          print(f"\n产物大小: {size:.1f} MB")
          PY

      - name: 冒烟测试
        run: |
          set +e
          timeout 8 ./dist/podman-gui > /tmp/smoke.log 2>&1
          RC=$?
          echo "退出码: $RC（124 = 超时正常，0 = 正常退出）"
          echo "--- 输出 ---"
          cat /tmp/smoke.log
          if [ $RC -ne 0 ] && [ $RC -ne 124 ]; then
            echo "::error::冒烟测试失败，退出码 $RC"
            exit 1
          fi

      - name: 准备发布文件
        id: pkg
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          NAME="podman-gui-v${VERSION}-linux-x86_64"

          mkdir -p release
          cp dist/podman-gui "release/${NAME}"
          chmod +x "release/${NAME}"

          # 安装脚本 + 桌面文件 + 图标，打成一个可解压即安装的包
          STAGE=$(mktemp -d)
          cp dist/podman-gui "$STAGE/${NAME}"
          chmod +x "$STAGE/${NAME}"
          cp install.sh "$STAGE/"
          chmod +x "$STAGE/install.sh"
          cp resources/podman-gui.desktop "$STAGE/"
          cp -r resources/appicon "$STAGE/"
          tar -czf "release/${NAME}.tar.gz" -C "$STAGE" .
          rm -rf "$STAGE"

          # 校验和
          ( cd release && sha256sum "${NAME}" > "${NAME}.sha256" )

          {
            echo "name=${NAME}"
            echo "version=${VERSION}"
          } >> "$GITHUB_OUTPUT"

          ls -lh release/

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: podman-gui-${{ steps.pkg.outputs.version }}
          path: release/*
          retention-days: 14
          if-no-files-found: error

      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.pkg.outputs.version }}
          generate_release_notes: true
          files: |
            release/${{ steps.pkg.outputs.name }}
            release/${{ steps.pkg.outputs.name }}.sha256
            release/${{ steps.pkg.outputs.name }}.tar.gz
          body: |
            ## 两种安装方式

            ### 方式一：一键安装（推荐）

            下载 `.tar.gz` 压缩包，解压后运行 `install.sh`：

            ```bash
            tar -xzf ${{ steps.pkg.outputs.name }}.tar.gz -C podman-gui-install
            cd podman-gui-install
            ./install.sh
            ```

            脚本会完成三件事：
            - 复制可执行文件到 `~/.local/bin/podman-gui`
            - 安装桌面入口到应用菜单
            - 安装图标到当前 KDE 主题目录（自动检测主题）

            之后在应用菜单搜索「Podman」或终端执行 `podman-gui` 即可。

            **卸载**：`./install.sh --uninstall`
            **系统级安装**：`./install.sh --system`（需 sudo，装到 `/usr/local`）

            ### 方式二：直接运行（不安装）

            下载单个可执行文件，加执行权限后直接跑：

            ```bash
            chmod +x ${{ steps.pkg.outputs.name }}
            ./${{ steps.pkg.outputs.name }}
            ```

            这样不会出现在应用菜单里，也不会装图标，适合临时试用。

            ---

            ## 前置条件：Podman socket

            ```bash
            systemctl --user enable --now podman.socket
            ```

            验证：

            ```bash
            curl --unix-socket /run/user/$(id -u)/podman/podman.sock \
                 --noproxy '*' http://d/v5.0.0/libpod/_ping
            # 应返回 OK
            ```

            ## 系统依赖

            单文件已内置 Python 与 PyQt6，但需系统提供 Qt6 基础库：

            | 发行版 | 命令 |
            |---|---|
            | Arch / CachyOS | `sudo pacman -S qt6-base qt6-svg` |
            | Ubuntu / Debian | `sudo apt install libqt6svg6` |
            | Fedora | `sudo dnf install qt6-qtsvg` |

            `install.sh` 会自动检查，缺失时给出对应命令。

            ## 校验下载

            ```bash
            sha256sum -c ${{ steps.pkg.outputs.name }}.sha256
            ```

            ## 文件说明

            | 文件 | 用途 |
            |---|---|
            | `${{ steps.pkg.outputs.name }}` | 可执行文件（82 MB，直接运行） |
            | `${{ steps.pkg.outputs.name }}.tar.gz` | 完整安装包（含 install.sh + 图标） |
            | `${{ steps.pkg.outputs.name }}.sha256` | 校验和 |
